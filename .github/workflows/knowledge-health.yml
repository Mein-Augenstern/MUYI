name: Knowledge Health Check (weekly)

# 全库七维体检（constellation skill 固化脚本）：多H1/泛用首标题/死链 归零是质量底线；
# 互链孤岛/巨无霸 为观察项（数量变化触发关注，不阻断）。
# 另跑本库自己的两道门禁：链接与导航收录（区分大小写、认得出裸空格链接）、README 数字。
# 2026-11-07 基线：全部 0（巨无霸 17 已知长文、孤岛 27 叶子篇，见治理 commit fbb9c00）。
# 2026-11-24 修：constellation 曾被检出到库根目录下，体检脚本把它也当成一个轨道扫了进去
# （21 个假“多H1”），本流水线连续三周失败、盖住了 MUYI 自己的信号。现在改为克隆到工作区之外。
on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 UTC 03:00（北京 11:00）
  workflow_dispatch:        # 支持手动触发

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch constellation audit scripts (outside the audited tree)
        run: |
          git clone --depth 1 https://github.com/Mein-Augenstern/constellation.git "$RUNNER_TEMP/constellation"
          test -f "$RUNNER_TEMP/constellation/skills/kb-article-writing/scripts/global-audit.py"

      - name: Run global audit (7 dimensions)
        run: python3 "$RUNNER_TEMP/constellation/skills/kb-article-writing/scripts/global-audit.py" . --json audit.json

      - name: Enforce baselines (multi-H1 / generic-first / dead-links must be 0)
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("audit.json"))
          violations = []
          if d["multi_h1"]:
              violations.append(f"多H1 残留 {len(d['multi_h1'])}: " + "; ".join(d["multi_h1"][:5]))
          if d["generic_first"]:
              violations.append(f"泛用首标题 {len(d['generic_first'])}: " + "; ".join(d["generic_first"][:5]))
          if d["dead"]:
              violations.append(f"死链 {len(d['dead'])}: " + "; ".join(d["dead"][:5]))
          if violations:
              print("质量底线被打破：")
              print("\n".join(violations))
              sys.exit(1)
          print("质量底线全部保持：多H1=0 泛用标题=0 死链=0")
          PY

      - name: Repo gates (links / nav coverage / README numbers)
        run: |
          python3 scripts/check_links.py --src
          python3 scripts/stats.py --check

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-audit
          path: audit.json
